[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loremotion-mcp"
version = "1.0.0"
description = "MCP server for free, watermark-free video generation on loremotion.com"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "video-generation", "loremotion", "ai-video", "text-to-video"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
]
dependencies = []  # pure stdlib: urllib + asyncio only

[project.scripts]
loremotion-mcp = "loremotion_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
